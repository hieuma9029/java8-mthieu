# Kết nối MySQL; database shopping cần tồn tại trước khi chạy ứng dụng.
spring.datasource.url=jdbc:mysql://localhost:3306/shopping
# Tài khoản cơ sở dữ liệu được truyền qua biến môi trường, không ghi mật khẩu trong source code.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate cập nhật schema cho các entity mới như carts và cart_items khi khởi động.
spring.jpa.hibernate.ddl-auto=update
# In SQL ra console để thuận tiện theo dõi trong môi trường phát triển.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cart của khách chưa đăng nhập hết hạn sau 1 ngày kể từ lúc tạo.
app.cart.guest-expiration-days=1
# Chạy dọn cart hết hạn lúc 03:00 mỗi ngày.
app.cart.cleanup-cron=0 0 3 * * *

# Secret Base64 tối thiểu 256 bit; thay bằng giá trị riêng qua biến môi trường khi triển khai.
app.security.jwt.secret=${JWT_SECRET:ZmFrZS1zZWNyZXQta2V5LWZvci1sb2NhbC1kZXZlbG9wbWVudC0zMmJ5dGVz}
# JWT hết hạn sau 1 ngày.
app.security.jwt.expiration-ms=86400000
