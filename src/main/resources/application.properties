# Kết nối MySQL; database shopping cần tồn tại trước khi chạy ứng dụng.
spring.datasource.url=jdbc:mysql://localhost:3306/shopping
# Tài khoản cơ sở dữ liệu được truyền qua biến môi trường, không ghi mật khẩu trong source code.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate cập nhật schema cho các entity mới như carts và cart_items khi khởi động.
spring.jpa.hibernate.ddl-auto=update
# In SQL ra console để thuận tiện theo dõi trong môi trường phát triển.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
